<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register User Product</title>

    <!-- Bootstrap CSSのリンクを追加 -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- サイドバー -->
        <nav class="col-md-1 bg-light">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" href="/">ホーム</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/user/inventory">商品</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/user/register">登録</a>
                </li>
            </ul>
        </nav>

        <!-- 間隔を追加 -->
        <div class="col-md-1"></div>

        <!-- コンテンツ -->
        <div class="col-md-9">
            <h1 class="mt-5">Register User Product</h1>

            <!-- 新しい製品を追加するフォーム -->
            <form action="/user/addProduct" method="post">
                <div class="form-group">
                    <label for="userId">User Id:</label>
                    <input type="number" class="form-control" id="userId" name="userId" required>
                </div>
                <div class="form-group">
                    <label for="productId">Product Id:</label>
                    <input type="number" class="form-control" id="productId" name="productId" required>
                </div>
                <button type="submit" class="btn btn-success">Add Product</button>
            </form>

            <table class="table table-striped mt-3">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>userId</th>
                    <th>productId</th>
                </tr>
                </thead>
                <tbody>
                <!-- コントローラのmodel.addObjectのuserProductMappings リストの各要素を反復処理 -->
                <tr th:each="userProductMapping : ${userProductMappings}">
                    <td th:text="${userProductMapping.id}"></td>
                    <td th:text="${userProductMapping.userId}"></td>
                    <td th:text="${userProductMapping.productId}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
